<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>简单记账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#222;min-height:100vh;padding-bottom:120px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:20px;color:#333}
.sync{font-size:11px;color:#999;display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.dot.on{background:#22c55e}
.dot.off{background:#ef4444}
/* 收入支出切换 */
.toggle{display:flex;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;margin-bottom:12px}
.toggle button{flex:1;padding:12px;border:none;background:transparent;font-size:16px;font-weight:600;color:#888;cursor:pointer}
.toggle button.active{color:#fff}
.toggle .in.active{background:#ef4444}
.toggle .out.active{background:#22c55e}
/* 日期 */
.datebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;border:1px solid #e5e7eb}
.datebar .d{font-size:16px;font-weight:600;color:#333}
.datebar .today{font-size:12px;color:#3b82f6;background:#eff6ff;padding:4px 10px;border-radius:8px;border:none;cursor:pointer}
.datepicker{font-size:15px;border:1px solid #ddd;padding:6px 8px;border-radius:8px;color:#333}
/* 输入区 */
.inputcard{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb;margin-bottom:14px}
.amount-row{display:flex;align-items:center;border-bottom:1px solid #f0f0f0;padding-bottom:12px;margin-bottom:12px}
.amount-row span{font-size:20px;color:#333;margin-right:6px}
.amount-row input{flex:1;border:none;font-size:28px;font-weight:700;color:#333;outline:none}
.amount-row input::placeholder{color:#ccc;font-weight:400}
.note-row input{border:none;outline:none;font-size:15px;color:#444;padding:8px 0;width:100%}
.note-row input::placeholder{color:#bbb}
.addbtn{width:100%;padding:15px;border:none;border-radius:12px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;margin-top:6px}
.addbtn.in{background:#ef4444}
.addbtn.out{background:#22c55e}
.addbtn:active{opacity:.85}
/* 今日统计 */
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:12px;padding:12px;border:1px solid #e5e7eb;text-align:center}
.stat .label{font-size:12px;color:#999}
.stat .val{font-size:18px;font-weight:700;margin-top:4px}
.val.in{color:#ef4444}
.val.out{color:#22c55e}
.val.bal{color:#333}
/* 今日明细 */
h2.sec{font-size:15px;color:#666;margin:6px 0 10px;display:flex;align-items:center;justify-content:space-between}
h2.sec .count{color:#bbb;font-size:12px}
.list{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden}
.item{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid #f5f5f5}
.item:last-child{border-bottom:none}
.item .side{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0}
.side.in{background:#fee2e2;color:#ef4444}
.side.out{background:#dcfce7;color:#22c55e}
.item .mid{flex:1;margin:0 10px;min-width:0}
.item .mid .note{font-size:14px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid .time{font-size:11px;color:#bbb;margin-top:3px}
.item .amt{font-weight:700;font-size:16px}
.amt.in{color:#ef4444}
.amt.out{color:#22c55e}
.item .del{margin-left:10px;color:#ccc;font-size:20px;padding:4px;cursor:pointer;flex-shrink:0}
.item .del:active{color:#ef4444}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#ccc;font-size:14px;border:1px solid #e5e7eb}
/* 月份统计 */
.monthcard{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb;margin-top:16px}
.monthcard h3{font-size:15px;color:#666;margin-bottom:10px}
.mrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.mrow .l{color:#888}
.mrow .r{font-weight:700}
.mrow .r.in{color:#ef4444}
.mrow .r.out{color:#22c55e}
.mrow .r.bal{color:#333}
/* 历史每日 */
.hist{background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-top:16px;overflow:hidden}
.hist-ttl{padding:12px 14px;font-size:15px;color:#666;border-bottom:1px solid #f5f5f5}
.hist .hitem{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #f5f5f5}
.hist .hitem:last-child{border-bottom:none}
.hitem .hd{font-size:14px;color:#333;font-weight:600}
.hitem .hd small{color:#bbb;font-weight:400;font-size:11px;margin-left:4px}
.hitem .hv{font-size:13px}
.hv .hin{color:#ef4444;font-weight:600}
.hv .hout{color:#22c55e;font-weight:600;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📒 简单记账</h1>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncText">同步中</span></div>
  </div>

  <div class="toggle">
    <button id="btnIn" class="in active" onclick="setType('in')">收入 +</button>
    <button id="btnOut" class="out" onclick="setType('out')">支出 −</button>
  </div>

  <div class="datebar">
    <span class="d" id="dateLabel">今天</span>
    <input type="date" class="datepicker" id="datePicker">
    <button class="today" onclick="goToday()">回今天</button>
  </div>

  <div class="inputcard">
    <div class="amount-row"><span>¥</span><input type="number" id="amount" inputmode="decimal" placeholder="0.00" min="0.01" step="0.01"></div>
    <div class="note-row"><input type="text" id="note" placeholder="备注（可不填，例：午饭 / 房租）"></div>
    <button class="addbtn in" id="addBtn" onclick="addRecord()">记一笔</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">收 入</div><div class="val in" id="statIn">0</div></div>
    <div class="stat"><div class="label">支 出</div><div class="val out" id="statOut">0</div></div>
    <div class="stat"><div class="label">结 余</div><div class="val bal" id="statBal">0</div></div>
  </div>

  <h2 class="sec">今日明细 <span class="count" id="dayCount"></span></h2>
  <div id="dayList"></div>

  <div class="monthcard">
    <h3 id="monthTitle">本月统计</h3>
    <div class="mrow"><span class="l">收入合计</span><span class="r in" id="mIn">0</span></div>
    <div class="mrow"><span class="l">支出合计</span><span class="r out" id="mOut">0</span></div>
    <div class="mrow"><span class="l">结余</span><span class="r bal" id="mBal">0</span></div>
  </div>

  <h2 class="sec" style="margin-top:16px">历史记录</h2>
  <div class="hist" id="histList"></div>
</div>

<script>
const DBURL = 'https://spa123-da150-default-rtdb.asia-southeast1.firebasedatabase.app/';
const NODE = 'jizhang'; // 记账数据独立节点，不与SPA混

let DB = { records: [] };          // 所有记录
let type = 'in';                   // 当前录入类型
let viewDate = todayStr();         // 当前查看的日期
let currentViewRecords = [];       // 当前查看日期下的记录(按时间倒序)

// ---------- 工具 ----------
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10?'0'+n:''+n; }
function nowTime(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function money(n){ return '¥'+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function dateIn(rec){ return String(rec.date||''); }
function monthOf(s){ return s.slice(0,7); }
function fmtCN(s){ const p=s.split('-'); return p[1]+'月'+p[2]+'日'; }

// ---------- 数据库 ----------
async function readAll(){ const r=await fetch(DBURL+'.json',{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status); const j=await r.json(); return (j && j[NODE])||{records:[]}; }
async function writeNode(path,val){ const r=await fetch(DBURL+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)}); if(!r.ok)throw new Error('HTTP '+r.status); }

function setSync(ok,txt){ document.getElementById('dot').className='dot '+(ok?'on':'off'); document.getElementById('syncText').textContent=txt; }

async function save(){
  try{ await writeNode(NODE, DB); setSync(true,'● 已保存'); }
  catch(e){ setSync(false,'● 保存失败'); toast('保存失败：'+e.message); }
}

// ---------- UI ----------
function setType(t){
  type=t;
  const btnIn=document.getElementById('btnIn'), btnOut=document.getElementById('btnOut');
  btnIn.className= t==='in'?'in active':'in';
  btnOut.className= t==='out'?'out active':'out';
  const add=document.getElementById('addBtn');
  add.className='addbtn '+(t==='in'?'in':'out');
  add.textContent= t==='in'?'记一笔收入':'记一笔支出';
}

function render(){
  const day=dateIn(viewDate);
  // 今日明细
  currentViewRecords = DB.records.filter(r=>dateIn(r)===day).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let sin=0,sout=0;
  currentViewRecords.forEach(r=>{ if(r.type==='in')sin+=Number(r.amount)||0; else sout+=Number(r.amount)||0; });
  document.getElementById('statIn').textContent=money(sin);
  document.getElementById('statOut').textContent=money(sout);
  document.getElementById('statBal').textContent=money(sin-sout);

  const dl=document.getElementById('dayList');
  const cnt=document.getElementById('dayCount');
  cnt.textContent = currentViewRecords.length? (currentViewRecords.length+'笔') : '';
  if(currentViewRecords.length===0){
    dl.innerHTML='<div class="empty">这一天还没有记录 📭</div>';
  }else{
    dl.innerHTML='<div class="list">'+currentViewRecords.map(r=>`
      <div class="item">
        <div class="side ${r.type}">${r.type==='in'?'+':'−'}</div>
        <div class="mid">
          <div class="note">${esc(r.note||'未备注')}</div>
          <div class="time">${r.time||''}</div>
        </div>
        <div class="amt ${r.type}">${r.type==='in'?'+':'−'}${money(r.amount)}</div>
        <div class="del" onclick="delRecord('${r.id}')">×</div>
      </div>`).join('')+'</div>';
  }

  // 日期标签
  document.getElementById('dateLabel').textContent = viewDate===todayStr()?'今天':fmtCN(viewDate);

  // 月份统计
  const mon=monthOf(viewDate);
  let min=0,mout=0;
  DB.records.forEach(r=>{ if(monthOf(dateIn(r))===mon){ if(r.type==='in')min+=Number(r.amount)||0; else mout+=Number(r.amount)||0; }});
  document.getElementById('monthTitle').textContent=mon+' 月统计';
  document.getElementById('mIn').textContent=money(min);
  document.getElementById('mOut').textContent=money(mout);
  document.getElementById('mBal').textContent=money(min-mout);

  renderHist();
}

function renderHist(){
  // 按日倒序，显示每天收支
  const map={};
  DB.records.forEach(r=>{ const d=dateIn(r); (map[d]=map[d]||[]).push(r); });
  const days=Object.keys(map).sort().reverse();
  const hist=document.getElementById('histList');
  if(days.length===0){
    hist.innerHTML='<div class="hist-ttl">还没有任何记录</div>';
    return;
  }
  hist.innerHTML='<div class="hist-ttl">按天汇总（最新在前）</div>';
  hist.innerHTML+=days.map(d=>{
    const recs=map[d]; let hin=0,hout=0;
    recs.forEach(r=>{ if(r.type==='in')hin+=Number(r.amount)||0; else hout+=Number(r.amount)||0; });
    return `<div class="hitem">
      <div class="hd">${fmtCN(d)}<small>${recs.length}笔</small></div>
      <div class="hv"><span class="hin">+${money(hin)}</span><span class="hout">−${money(hout)}</span></div>
    </div>`;
  }).join('');
  hist.innerHTML+='<div class="hist-ttl" style="border-top:1px solid #f5f5f5;color:#bbb;text-align:center">共 '+DB.records.length+' 笔记录 · 永久保存</div>';
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 操作 ----------
async function addRecord(){
  const amt=parseFloat(document.getElementById('amount').value);
  if(!amt||amt<=0){ toast('请输入有效金额'); return; }
  document.getElementById('amount').value='';
  const note=document.getElementById('note').value.trim();
  document.getElementById('note').value='';
  const rec={ id:'r'+Date.now()+'_'+Math.floor(Math.random()*1000), type:type, amount:amt, note:note, date:viewDate, time:nowTime(), ts:Date.now() };
  DB.records.push(rec);
  await save();
  render();
}

async function delRecord(id){
  if(!confirm('删除这笔记录？'))return;
  DB.records=DB.records.filter(r=>r.id!==id);
  await save();
  render();
}

function goToday(){ viewDate=todayStr(); document.getElementById('datePicker').value=viewDate; render(); }

// ---------- 初始化 ----------
let toastTimer=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:999;white-space:nowrap;'; document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display='none',1600);
}

document.getElementById('datePicker').addEventListener('change',function(){ viewDate=this.value; render(); });
document.getElementById('datePicker').value=viewDate;

(async function init(){
  setSync(false,'加载中…');
  try{
    DB=await readAll();
    if(!DB.records||!Array.isArray(DB.records))DB.records=[];
    setSync(true,'● 已同步');
  }catch(e){
    DB={records:[]};
    setSync(false,'● 离线模式');
    toast('加载失败：'+e.message);
  }
  render();
})();
</script>
</body>
</html>
