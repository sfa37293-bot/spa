<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPA 营业看板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;padding-bottom:30px}
  .top{position:sticky;top:0;background:#1d1d1f;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50}
  .top h1{font-size:17px}
  .top .time{font-size:12px;opacity:.7;margin-top:2px}
  .live,.off{font-size:11px;padding:3px 8px;border-radius:12px}
  .live{background:#2e7d32;color:#fff}
  .off{background:#e53935;color:#fff}
  .container{max-width:560px;margin:0 auto;padding:14px}
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .room{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .room .rname{font-size:15px;font-weight:700;margin-bottom:8px}
  .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600}
  .tag.free{background:#e8f5e9;color:#2e7d32}
  .tag.busy{background:#ffebee;color:#c62828}
  .room .body{margin-top:10px;font-size:13px;color:#333}
  .room .body .line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f5f5f5}
  .room .empty{color:#aaa;font-size:13px;text-align:center;padding:14px 0}
  .panel{background:#fff;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .panel .gt{font-size:15px;font-weight:700;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .box{background:#f5f7fa;border-radius:10px;padding:12px;text-align:center}
  .box .n{font-size:20px;font-weight:800;color:#007aff}
  .box .l{font-size:11px;color:#888;margin-top:2px}
  .ts{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #f0f0f0;font-size:13px}
  .ts .tn{font-weight:600}
  .ts .tj{color:#2e7d32;font-weight:700}
  .foot{text-align:center;color:#aaa;font-size:11px;padding:14px 0}
  .upd{text-align:center;color:#aaa;font-size:11px;padding:4px}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:center;align-items:flex-start;padding:40px 16px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:420px;padding:18px}
  .modal h3{font-size:16px;margin-bottom:12px}
  .modal .close{float:right;background:none;border:none;font-size:20px;color:#999}
  .btn-row{display:flex;gap:9px;margin-top:12px}
  .btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;color:#fff;cursor:pointer}
  .btn.gr{background:#8e8e93}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>SPA 营业看板</h1>
    <div class="time" id="clock"></div>
  </div>
  <span id="statDot" class="live">● 实时</span>
</div>
<div class="container">
  <div class="rooms" id="roomsBox"></div>
  <div class="panel">
    <div class="gt">📊 营业汇总</div>
    <div class="grid">
      <div class="box"><div class="n" id="gTotal">0</div><div class="l">总钟数</div></div>
      <div class="box"><div class="n" id="gExtra">0</div><div class="l">加钟数</div></div>
      <div class="box"><div class="n" id="gShould">0</div><div class="l">应收</div></div>
      <div class="box"><div class="n" id="gGet">0</div><div class="l">实收</div></div>
      <div class="box" style="cursor:pointer;background:#e8f0fe" onclick="openTechComm()"><div class="n" id="gComm">0</div><div class="l" style="color:#007aff">技师提成 ▶</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="gt">🕒 房间上下钟时间</div>
    <div id="roomTimes"></div>
  </div>
  <div class="panel">
    <div class="gt">🧭 客户来源</div>
    <div id="sourceStats"></div>
  </div>
  <div class="panel">
    <div class="gt">📅 近7天每日营业</div>
    <div id="weekList"></div>
  </div>
  <div class="upd" id="updInfo">连接中…</div>
  <div class="foot">实时同步 · 数据来自云端</div>
</div>

<script>
const DBURL = 'https://spa123-da150-default-rtdb.asia-southeast1.firebasedatabase.app/';
function dc(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pad2(n){return String(n).padStart(2,'0');}
// 营业日：11点前(凌晨)归属前一天，11点及以后归属当天
function bizKeyFromDate(d){ const nd=new Date(d); if(nd.getHours()<11) nd.setDate(nd.getDate()-1); return dc(nd); }
function currentBizKey(){ return bizKeyFromDate(new Date()); }
function fmtClock(){ const d=new Date(); return d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

async function readNode(path){
  const r = await fetch(DBURL+path+'.json', {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function renderRooms(rooms){
  const box=document.getElementById('roomsBox'); box.innerHTML='';
  rooms.forEach(room=>{
    const busy = room && room.status==='busy' && room.cur;
    const div=document.createElement('div'); div.className='room';
    let body;
    if(busy){
      const items = room.cur.items.map((it,i)=>`<div class="line"><span>项目${i+1}${it.price===798?'(双人)':''}</span><span>¥${it.price}</span></div>`).join('');
      const techs=(room.cur.techs&&room.cur.techs.length)?room.cur.techs.join('、'):(room.cur.tech||'');
      body=`<div class="line"><span>技师</span><span>${techs}</span></div>
            <div class="line"><span>上钟</span><span>${room.cur.startTime||''}</span></div>${items}`;
    } else {
      body='<div class="empty">空闲 · 可上钟</div>';
    }
    div.innerHTML=`<div class="rname">${room.name} <span class="tag ${busy?'busy':'free'}">${busy?'上钟中':'空闲'}</span></div><div class="body">${body}</div>`;
    box.appendChild(div);
  });
}

function renderStats(records){
  records=records||[];
  const today=currentBizKey();
  const todays=records.filter(r=>r.date===today && !r.isReturn);
  const totalClocks=todays.reduce((s,r)=>s+(r.itemCount||1),0);
  const extraClocks=todays.reduce((s,r)=>s+(r.extraCount||0),0);
  const should=todays.reduce((s,r)=>s+(r.origTotal||r.total||0),0);
  const get=todays.reduce((s,r)=>s+(r.total||0),0);
  const comm=todays.reduce((s,r)=>s+(r.commission||0),0);
  document.getElementById('gTotal').textContent=totalClocks;
  document.getElementById('gExtra').textContent=extraClocks;
  document.getElementById('gShould').textContent=should;
  document.getElementById('gGet').textContent=get;
  document.getElementById('gComm').textContent=comm;
  const map={};
  const CMAP={198:90,298:140,398:190,498:240};
  todays.forEach(r=>{
    (r.items||[]).forEach(it=>{
      const techs=it.techs&&it.techs.length?it.techs:(r.techs||[r.tech]);
      const comm=(it.orig===798)?(190*techs.length):(CMAP[it.orig]||0);
      const per=techs.length?Math.round(comm/techs.length):comm;
      techs.forEach(tn=>{ if(!map[tn])map[tn]={c:0,t:0}; map[tn].c+=1; map[tn].t+=per; });
    });
    if(r.named && r.namedTech){ if(!map[r.namedTech])map[r.namedTech]={c:0,t:0}; map[r.namedTech].t+=20; }
  });
  viewTechMap=map;
}
let viewTechMap={};
function openTechComm(){
  const names=Object.keys(viewTechMap);
  const rows=names.length
    ? names.map((n,idx)=>`<div class="ts" style="border:none"><span style="color:#888;font-size:12px;width:22px">${idx+1}.</span><span class="tn" style="flex:1">${n}</span><span>${viewTechMap[n].c}钟</span><span class="tj">¥${viewTechMap[n].t}</span></div>`).join('')
    : '<div style="text-align:center;color:#aaa;padding:16px">今日暂无提成</div>';
  const mask=document.createElement('div');
  mask.className='modal-mask show'; mask.style.zIndex=260;
  mask.innerHTML=`<div class="modal" style="max-width:440px"><button class="close" onclick="this.closest('.modal-mask').remove()">×</button><h3>👤 技师提成明细</h3>${rows}<div class="btn-row" style="margin-top:14px"><button class="btn gr" onclick="this.closest('.modal-mask').remove()">关闭</button></div></div>`;
  document.body.appendChild(mask);
}

function renderRoomTimes(records,rooms){
  records=records||[]; rooms=rooms||[];
  const today=currentBizKey();
  const todays=records.filter(r=>r.date===today);
  const order=rooms.map(r=>r.name);
  let html='';
  order.forEach(rn=>{
    const rows=todays.filter(r=>r.room===rn);
    const retCount=rows.filter(r=>r.isReturn).length;
    html += `<div class="ts" style="font-weight:700"><span>${rn}</span><span>${rows.length}单${retCount?'（退'+retCount+'）':''}</span></div>`;
    html += rows.length
      ? `<div style="background:#f9fafb;border-radius:8px;padding:5px 8px;margin-bottom:6px">`+rows.map(r=>{
          const techs=(r.techs&&r.techs.length)?r.techs.join('、'):(r.tech||'');
          if(r.isReturn){
            return `<div style="padding:5px 0;border-bottom:1px dashed #e5e5ea;font-size:12px;color:#c62828">
              <div style="font-weight:600">↩️ 退钟 · ${techs}</div>
              <div style="color:#c62828">${r.startTime||'--'} 上 → ${r.endTime||'--'}（无提成）</div>
              <div style="color:#888">原因：${r.retReason||'--'}</div>
            </div>`;
          }
          let itHtml=(r.items||[]).map((it,ix)=>{
            const its=it.techs&&it.techs.length?it.techs:(r.techs||[r.tech]);
            let commTxt;
            if(it.orig===798){ commTxt=its.map(t=>`${t}¥190`).join(' / '); }
            else { commTxt=its.map((t,ti)=>ti===0?`${t}¥${({198:90,298:140,398:190,498:240}[it.orig]||0)}`:`${t}`).join(' / '); }
            const priceTxt=`${it.orig}${it.fin!==it.orig?('→'+it.fin):''}元${it.orig===798?'（双人）':''}`;
            return `<div style="color:#333">${ix+1}. ${priceTxt}｜${its.join('、')}｜提成 ${commTxt}</div>`;
          }).join('')||`1. ${r.itemCount||1}钟`;
          const pay=(r.pay&&r.pay.length)?r.pay.join('/'):'--';
          const note=r.note?`<div style="color:#888">备注：${r.note}</div>`:'';
          const namedTxt=(r.named&&r.namedTech)?`<div style="color:#e65100">⭐ 点钟：${r.namedTech} +20</div>`:'';
          const srcTxt=r.source?`<div style="color:#555">客户来源：${r.source}</div>`:'';
          return `<div style="padding:5px 0;border-bottom:1px dashed #e5e5ea;font-size:12px">
            <div style="font-weight:600;color:#333">技师：${techs}</div>
            <div style="color:#555">${r.startTime||'--'} 上 → ${r.endTime||'--'} 下</div>${itHtml}${namedTxt}${srcTxt}
            <div style="color:#555">结账：${pay}</div>
            <div style="color:#888">应收 ¥${r.origTotal||0} → 实收 ¥${r.total||0}（提成合计 ¥${r.commission||0}）</div>${note}
          </div>`;
        }).join('')+`</div>`
      : '<div style="color:#aaa;font-size:12px;padding:3px 0">今日暂无</div>';
  });
  document.getElementById('roomTimes').innerHTML = html || '<div style="color:#aaa;padding:10px">暂无数据</div>';
}

function renderWeek(records){
  records=records||[];
  const now=new Date();
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); days.push(bizKeyFromDate(d)); }
  let html='';
  days.forEach(key=>{
    const todaysAll=records.filter(r=>r.date===key);
    const todays=todaysAll.filter(r=>!r.isReturn);
    const retCount=todaysAll.length-todays.length;
    const total=todays.reduce((s,r)=>s+(r.itemCount||1),0);
    const should=todays.reduce((s,r)=>s+(r.origTotal||r.total||0),0);
    const get=todays.reduce((s,r)=>s+(r.total||0),0);
    const comm=todays.reduce((s,r)=>s+(r.commission||0),0);
    const isToday=(key===currentBizKey());
    const safeKey=key.replace(/-/g,'');
    html+=`
      <div class="ts" style="cursor:pointer;${isToday?'background:#e8f0fe':''}" onclick="toggleDay('${safeKey}')">
        <span class="tn">${key.slice(5)}${isToday?'（今）':''}</span>
        <span>${todays.length}单·${total}钟${retCount?'·退'+retCount:''}</span>
        <span style="font-size:11px;color:#e65100;font-weight:700">应¥${should}</span>
        <span style="color:#2e7d32;font-weight:700">实¥${get}</span>
      </div>
      <div id="wk_${safeKey}" style="display:none;background:#f9fafb;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px">${renderDayDetail(todaysAll)}</div>`;
  });
  document.getElementById('weekList').innerHTML=html||'<div style="color:#aaa;padding:10px">暂无</div>';
}
function toggleDay(safeKey){
  const el=document.getElementById('wk_'+safeKey);
  if(el) el.style.display = (el.style.display==='none')?'block':'none';
}
function renderDayDetail(rows){
  if(!rows.length) return '<div style="color:#aaa">当日暂无记录</div>';
  const norm=rows.filter(r=>!r.isReturn);
  const rets=rows.filter(r=>r.isReturn);
  const sumShould=norm.reduce((s,r)=>s+(r.origTotal||r.total||0),0);
  const sumGet=norm.reduce((s,r)=>s+(r.total||0),0);
  const sumComm=norm.reduce((s,r)=>s+(r.commission||0),0);
  let h=`<div style="font-weight:700;color:#333;padding:3px 0">应收 ¥${sumShould} ｜ 实收 ¥${sumGet} ｜ 提成 ¥${sumComm}${rets.length?' ｜ 退钟 '+rets.length+'单':''}</div>`;
  h+=rows.map(r=>{
    const techs=(r.techs&&r.techs.length)?r.techs.join('、'):(r.tech||'');
    const items=(r.items||[]).map(it=>`${it.orig}${it.fin!==it.orig?('→'+it.fin):''}元${it.orig===798?'(双人)':''}`).join('、')||`${r.itemCount||1}钟`;
    const pay=(r.pay&&r.pay.length)?r.pay.join('/'):'--';
    if(r.isReturn){
      return `<div style="padding:4px 0;border-bottom:1px dashed #e5e5ea;color:#c62828">
        <div style="font-weight:600">↩️ 退钟 · ${r.room}·${techs}</div>
        <div style="color:#c62828">${r.startTime||'--'}上→${r.endTime||'--'}下（无提成）</div>
        <div style="color:#888">原因：${r.retReason||'--'}</div>
      </div>`;
    }
    const note=r.note?`<div style="color:#888">备注：${r.note}</div>`:'';
    const namedTxt=(r.named&&r.namedTech)?`<div style="color:#e65100">⭐ 点钟：${r.namedTech} +20</div>`:'';
    return `<div style="padding:4px 0;border-bottom:1px dashed #e5e5ea">
      <div style="font-weight:600">${r.room}·${techs}</div>
      <div style="color:#555">${r.startTime||'--'}上→${r.endTime||'--'}下 ｜ ${items}</div>
      <div style="color:#555">结账：${pay} ｜ 应收¥${r.origTotal||0}→实收¥${r.total||0}</div>${namedTxt}${note}
    </div>`;
  }).join('');
  return h;
}

function renderSource(records){
  records=records||[];
  const today=currentBizKey();
  const srcMap={};
  records.filter(r=>r.date===today && !r.isReturn).forEach(r=>{
    const s=r.source||'未选';
    if(!srcMap[s]) srcMap[s]={c:0,t:0};
    srcMap[s].c+=1; srcMap[s].t+=(r.total||0);
  });
  const names=Object.keys(srcMap);
  document.getElementById('sourceStats').innerHTML=names.length
    ? names.map(n=>`<div class="ts"><span class="tn">${n}</span><span>${srcMap[n].c}单</span><span style="color:#007aff;font-weight:700">¥${srcMap[n].t}</span></div>`).join('')
    : '<div style="text-align:center;color:#aaa;padding:10px">暂无</div>';
}

async function tick(){
  try{
    const st = await readNode('');
    if(!st || !st.rooms){ return; }
    renderRooms(st.rooms);
    renderStats(st.records);
    renderRoomTimes(st.records, st.rooms);
    renderWeek(st.records);
    renderSource(st.records);
    document.getElementById('statDot').className='live'; document.getElementById('statDot').textContent='● 实时';
    document.getElementById('updInfo').textContent='更新于 '+fmtClock();
  }catch(e){
    document.getElementById('statDot').className='off'; document.getElementById('statDot').textContent='● 离线';
    document.getElementById('updInfo').textContent='连接失败：'+e.message;
  }
}
function loop(){ tick(); setInterval(tick,4000); }
document.getElementById('clock').textContent=fmtClock();
setInterval(()=>{ document.getElementById('clock').textContent=fmtClock(); },1000);
loop();
</script>
</body>
</html>
